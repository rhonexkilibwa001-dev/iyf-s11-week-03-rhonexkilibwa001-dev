<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>To‑Do App — Week 03</title>
  <link rel="stylesheet" href="css/todo.css">
</head>
<body>
  <main class="container" id="app">
    <header>
      <h1>To‑Do List</h1>
      <p class="sr-only" id="task-count-label">You have <span id="task-count">0</span> tasks</p>
    </header>

    <section class="todo-input">
      <form id="add-form" aria-labelledby="add-task-label">
        <label id="add-task-label" for="new-task" class="visually-hidden">Add a new task</label>
        <input id="new-task" name="new-task" type="text" placeholder="Add a new task" autocomplete="off" required>
        <button type="submit" aria-label="Add task">Add</button>
      </form>
    </section>

    <section class="todo-controls">
      <div class="filters" role="tablist" aria-label="Filter tasks">
        <button class="filter active" data-filter="all" role="tab" aria-selected="true">All</button>
        <button class="filter" data-filter="active" role="tab" aria-selected="false">Active</button>
        <button class="filter" data-filter="completed" role="tab" aria-selected="false">Completed</button>
      </div>
      <div>
        <button id="clear-completed">Clear completed</button>
      </div>
    </section>

    <section>
      <ul id="todo-list" aria-live="polite"></ul>
    </section>

    <footer>
      <p id="status"></p>
    </footer>
  </main>

  <script src="js/todo.js" type="module"></script>
</body>
</html>
